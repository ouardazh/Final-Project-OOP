<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEHICLE RENTAL</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <!-- !This is the Header ------ -->
    <header>
      <nav>
        <div class="logo">
            <p class="firstLogo">Rif</p>
            <p class="secondLogo">Car <span>®</span> </p>
        </div>

        <div class="links">
          <a class="link1" href="#">Your fleet</a>
          <a class="link2" href="#">Add vehicle</a>
        </div>

        <div class="rentalStudio">
          <p class="point">●</p>
          <p>Your rentel studio</p>
        </div>
      </nav>
    </header>


    <!-- !This is a Main------ -->
     <main>
        <!-- !This is the Hero Section----- -->
         <section class="hero">

            <div class="left-hero">
                <p class="firstText">LESS ADMIN. MORE ADVENTURE</p>
                <p class="secondText">A good ride. <br> A better day.</p>
                <p class="thirdText">Keep your fleet moving, one joueney at a time.</p>
            </div>

            <div>
              <!-- <img src="" alt="mercedes"> -->
            </div>
            

         </section>

         <!-- !This is the cards section----- -->
          <section class="container-cards">
            <div class="first-card">
              <div class="icon">𝄜</div>
              <div class="info">
                <p>Total vehicles</p>
                <h3 id="totalVehicles">0</h3>
              </div>

              <span>Your collection</span>
            </div>
            <!-- !---------------- -->
             <div class="first-card">
              <div class="icon1">✓</div>
              <div class="info">
                <p>Total vehicles</p>
                <h3 id="totalVehicles">0</h3>
              </div>

              <span>Your collection</span>
            </div>

            <!-- !---------------- -->
             <div class="first-card">
              <div class="icon2">/┆\</div>
              <div class="info">
                <p>Total vehicles</p>
                <h3 id="totalVehicles">0</h3>
              </div>

              <span>Your collection</span>
            </div>

            
          </section>


         <!-- !This is th add Vehicle Section--- -->
          <section class="add-vehicle">
            <div class="container-form">
              <form action="" id="vehicleForm">
              <label for="name">Vehicle name</label> <br>
              <input type="text" placeholder="e.g Peugeot 208" id="nameVehicle"> <br> <br>

              <label for="">Vehicle type</label> <br>
              <select name="" id="vehicleType">
                <option value="">Car</option>
                <option value="">Motorcycle</option>
                <option value="">Bicycle</option>
              </select> <br><br>

              <label for="">Daily rental price</label> <br>
              <input type="number" id="dailyPrice"> <br><br>

              <button id="addBtn" type="submit">✚ Add vehicle</button>

              <p id="error"></p>
            </form>
            </div>

            <div id="result">
    

            </div>
            <div>

            </div>
            
          </section>
     </main>

    <script src="./script.js"></script>
  </body>
</html>
